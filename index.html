<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Froggywater — Ramping Metronome for Practice</title>
  <meta name="description" content="Froggywater is a free ramping metronome and speed trainer. Set a starting tempo, a goal tempo, and a bar loop — it gradually increases the BPM as you practice, from where you are to where you want to be.">
  <meta name="keywords" content="metronome, ramping metronome, speed trainer, tempo trainer, practice metronome, gradually increase tempo, BPM trainer, tap tempo">
  <meta property="og:title" content="Froggywater — Ramping Metronome">
  <meta property="og:description" content="A metronome that gradually ramps the tempo while you practice. Set a start BPM, a goal BPM, and a bar loop — Froggywater does the rest.">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#f6f1e7">
  <link rel="preload" href="fonts/fraunces-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="o-page c-app">

    <header class="c-masthead">
      <h1 class="c-masthead__name">Froggywater</h1>
      <p class="c-masthead__tagline">a ramping metronome</p>
    </header>

    <div class="o-layout">
    <section class="c-hero" aria-label="Current tempo">
      <div class="c-hero__figure" id="hero-pulse">
        <span class="c-hero__bpm" id="hero-bpm">60</span>
        <span class="c-hero__unit">beats per minute</span>
      </div>

      <div class="c-ramp" aria-label="Progress from start tempo to end tempo">
        <span class="c-ramp__bound" id="ramp-start">60</span>
        <div class="c-ramp__line" id="ramp-line">
          <div class="c-ramp__fill"></div>
          <div class="c-ramp__dot"></div>
        </div>
        <span class="c-ramp__bound" id="ramp-end">120</span>
      </div>

      <div class="c-transport">
        <button class="c-btn c-btn--icon c-btn--primary" id="btn-play" aria-label="Play">
          <svg class="c-icon c-icon--play" viewBox="0 0 24 24" aria-hidden="true"><path d="M7.5 4.5v15l13-7.5z"/></svg>
          <svg class="c-icon c-icon--pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.5 4.5h4.2v15H6.5zM13.3 4.5h4.2v15h-4.2z"/></svg>
        </button>
        <button class="c-btn c-btn--icon" id="btn-reset" aria-label="Reset to start tempo">
          <svg class="c-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5V1.8L6.8 6 12 10.2V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg>
        </button>
      </div>
      <p class="c-caption c-caption--center">space toggles play&thinsp;/&thinsp;pause</p>
    </section>

    <section class="c-settings" aria-label="Metronome settings">

      <div class="c-row">
        <div class="c-row__lead">
          <label class="c-row__label" for="input-start">Start tempo</label>
          <p class="c-caption">drag, type, or press <kbd class="c-kbd">S</kbd> to tap</p>
        </div>
        <div class="c-row__controls">
          <button class="c-btn c-btn--tap" id="tap-start">tap</button>
          <input class="c-num" id="input-start" type="number" min="20" max="300" step="1" inputmode="numeric">
        </div>
      </div>

      <div class="c-row">
        <div class="c-row__lead">
          <label class="c-row__label" for="input-end">End tempo</label>
          <p class="c-caption">drag, type, or press <kbd class="c-kbd">E</kbd> to tap</p>
        </div>
        <div class="c-row__controls">
          <button class="c-btn c-btn--tap" id="tap-end">tap</button>
          <input class="c-num" id="input-end" type="number" min="20" max="300" step="1" inputmode="numeric">
        </div>
      </div>

      <div class="c-row">
        <div class="c-row__lead">
          <label class="c-row__label" for="input-bars">Bars per loop</label>
        </div>
        <div class="c-row__controls">
          <input class="c-num" id="input-bars" type="number" min="1" max="999" step="1" inputmode="numeric">
        </div>
      </div>

      <div class="c-row">
        <div class="c-row__lead">
          <label class="c-row__label" for="input-increment">Increment</label>
          <p class="c-caption">BPM added after each loop</p>
        </div>
        <div class="c-row__controls">
          <input class="c-num" id="input-increment" type="number" min="1" max="20" step="1" inputmode="numeric">
        </div>
      </div>

      <div class="c-row">
        <div class="c-row__lead">
          <label class="c-row__label" for="input-timesig">Time signature</label>
        </div>
        <div class="c-row__controls">
          <select class="c-num c-num--select" id="input-timesig">
            <option value="4/4">4/4</option>
            <option value="3/4">3/4</option>
            <option value="2/4">2/4</option>
            <option value="2/2">2/2</option>
            <option value="5/4">5/4</option>
            <option value="6/8">6/8</option>
            <option value="7/8">7/8</option>
            <option value="9/8">9/8</option>
            <option value="12/8">12/8</option>
          </select>
        </div>
      </div>

      <div class="c-row">
        <div class="c-row__lead">
          <label class="c-row__label" for="input-volume">Volume</label>
        </div>
        <div class="c-row__controls c-row__controls--wide">
          <input class="c-slider" id="input-volume" type="range" min="0" max="100" step="1">
        </div>
      </div>

      <div class="c-row">
        <div class="c-row__lead">
          <label class="c-row__label" for="input-emphasize">Emphasize the 1</label>
          <p class="c-caption">a brighter ding on the downbeat</p>
        </div>
        <div class="c-row__controls">
          <input class="c-toggle" id="input-emphasize" type="checkbox">
        </div>
      </div>

    </section>
    </div>

  </main>
  <script src="app.js"></script>
</body>
</html>
